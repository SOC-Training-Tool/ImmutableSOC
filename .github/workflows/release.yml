name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
      - 'docs/**'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci] or [ci skip]
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Check for version bump needed
      id: check
      run: |
        # Get the last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Last tag: $LAST_TAG"

        # Check if there are any conventional commits since last tag
        COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")

        if [ -z "$COMMITS" ]; then
          echo "No commits since last tag, skipping release"
          echo "should_release=false" >> $GITHUB_OUTPUT
        else
          echo "Found commits since last tag, proceeding with release"
          echo "should_release=true" >> $GITHUB_OUTPUT
        fi

    - name: Bump version
      if: steps.check.outputs.should_release == 'true'
      id: bump
      run: |
        chmod +x .github/scripts/bump-version.sh
        .github/scripts/bump-version.sh

    - name: Commit version bump
      if: steps.check.outputs.should_release == 'true'
      run: |
        git add build.sbt
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || echo "No changes to commit"

    - name: Create and push tag
      if: steps.check.outputs.should_release == 'true'
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
        git push origin master
        git push origin "v$NEW_VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      if: steps.check.outputs.should_release == 'true'
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version**: ${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Bump Type**: ${{ steps.bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tag**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The publish workflow will now automatically publish to Maven Central." >> $GITHUB_STEP_SUMMARY
